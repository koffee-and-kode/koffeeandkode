# One entry per book. The Home tile counts entries here; chapter posts under
# `_posts/books/<slug>/` are not counted as separate books.
#
# Fields:
#   slug   — the folder name under _posts/books/ (required)
#   title  — display title (required)
#   author — author name (optional)
#   status — reading / done / queued / paused (optional; free-form)
#   theme  — slug from _data/books_themes.yml (required for /books/ tile grouping)

